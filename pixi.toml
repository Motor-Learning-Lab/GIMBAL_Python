[workspace]
name = "gimbal-python"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.11.*"
pip = "*"
scikit-learn = "*"
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"
pymc = "*"
nutpie = "*"
arviz = "*"
preliz = "*"
ipywidgets = "*"
pytest = "*"

[activation]
env = { PYTENSOR_FLAGS = "compiledir=C:/Users/86153/pytensor_cache" }
[tasks]
# Install package in editable mode
install-dev = "pip install -e ."

# Quick environment validation
check-setup = { cmd = "python -c 'import gimbal_pymc, pymc, nutpie; print(\"✓ Environment OK\")'" }

# PyMC pipeline demos
demo-pymc = "python examples/demo_v0_2_0_pymc_pipeline.py"
demo-priors = "python examples/demo_v0_2_1_data_driven_priors.py"

# Launch JupyterLab for interactive notebooks
notebook = "jupyter lab"

# Dataset generation
generate-datasets = "python tests/pipeline/generate_dataset.py"

# Testing
test-p0 = "pytest tests/smoke/ tests/unit/ tests/integration/ tests/test_stage1_collapsed_hmm.py tests/test_stage2_camera_model.py -v"
test-pipeline = "pytest tests/pipeline/test_synthetic_data_generator.py -v"
test-unit = "pytest tests/unit/ -v"
test-stages = "pytest tests/test_stage1_collapsed_hmm.py tests/test_stage2_camera_model.py -v"
test-integration = "pytest tests/integration/ -v"
test-smoke = "pytest tests/smoke/ -v"
test-all = "pytest tests/ -v"
test-diagnostics = "pytest tests/diagnostics/ -v"

# Pipeline stages (for L00_minimal dataset)
pipeline-clean = "python tests/pipeline/stage_b_clean_2d.py tests/pipeline/datasets/L00_minimal tests/pipeline/fits/L00_minimal"
pipeline-triangulate = "python tests/pipeline/stage_c_triangulation.py tests/pipeline/datasets/L00_minimal tests/pipeline/fits/L00_minimal"
pipeline-full = "python tests/pipeline/fit_L00_toolchain.py"

# C1 Capability Ladder
# Run a single ladder step end-to-end (generate + full pipeline A-J):
#   pixi run ladder-run L00_minimal
ladder-run = "python scripts/run_ladder.py"

# Smoke test: L00_minimal through stages A-G only (skips MCMC, fast):
ladder-smoke = "python scripts/run_ladder.py L00_minimal --stages A-G"

# Full ladder baseline (all steps A-J, slow — run before tagging a release):
ladder-baseline = { cmd = "python scripts/run_ladder.py L00_minimal && python scripts/run_ladder.py L01_noise && python scripts/run_ladder.py L02_outliers && python scripts/run_ladder.py L03_missingness && python scripts/run_ladder.py L04_combined && python scripts/run_ladder.py L05_topology && python scripts/run_ladder.py L06_coverage && python scripts/run_ladder.py L07_full_challenge" }

# List available ladder steps:
ladder-list = "python -c \"from pathlib import Path; [print(p.stem) for p in sorted(Path('datasets/ladder').glob('*.yaml'))]\""
